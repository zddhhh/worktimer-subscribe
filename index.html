<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载 WorkTimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #12161c;
  --fog: #66707c;
  --line: rgba(18, 22, 28, 0.12);
  --sun: #e56a18;
  --sea: #1f6f6a;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.55 "Noto Sans SC", sans-serif;
  background:
    radial-gradient(700px 420px at 90% 0%, rgba(255, 156, 84, 0.28), transparent 55%),
    radial-gradient(560px 360px at 0% 100%, rgba(47, 168, 158, 0.14), transparent 50%),
    #eef2f6;
}
.wrap {
  width: min(440px, calc(100% - 32px));
  margin: 0 auto;
  padding: 56px 0 64px;
}
.kicker {
  margin: 0 0 14px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--sea);
}
.brand {
  margin: 0;
  font-family: Syne, "Noto Sans SC", sans-serif;
  font-size: clamp(52px, 12vw, 72px);
  font-weight: 800;
  letter-spacing: -0.055em;
  line-height: 0.88;
}
.brand span {
  display: block;
  background: linear-gradient(115deg, #12161c 0%, #163a38 48%, #c45a12 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub {
  margin: 14px 0 0;
  font-size: clamp(18px, 3.5vw, 22px);
  font-weight: 700;
  letter-spacing: 0.06em;
}
.lead {
  margin: 12px 0 0;
  color: var(--fog);
  font-size: 15px;
}
.ver {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 0;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
}
.ver::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--sea);
  box-shadow: 0 0 0 4px rgba(31, 111, 106, 0.14);
}
.panel {
  margin-top: 28px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: #fff;
}
.panel h1 {
  margin: 0 0 6px;
  font-size: 18px;
}
.note {
  margin: 0 0 16px;
  color: var(--fog);
  font-size: 13px;
}
.os { display: grid; gap: 8px; margin-bottom: 12px; }
.os label {
  display: block;
  margin: 0;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
}
.os label:has(input:checked) {
  border-color: rgba(229, 106, 24, 0.5);
  background: #fff7f0;
}
.os input { accent-color: var(--sun); margin-right: 8px; }
.os strong { font-size: 14px; }
.os span { display: block; margin: 4px 0 0 24px; color: var(--fog); font-size: 12px; }
.dl {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  text-decoration: none;
  color: #fff;
  background: var(--sun);
  font-family: Syne, "Noto Sans SC", sans-serif;
  font-size: 16px;
  font-weight: 700;
}
.dl:hover { filter: brightness(1.05); }
.dl.off {
  color: var(--fog);
  background: #e8edf3;
  pointer-events: none;
}
.hint { margin: 10px 2px 0; color: var(--fog); font-size: 13px; }
.mail-panel {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #f7f9fb;
}
.mail-panel summary {
  cursor: pointer;
  list-style: none;
  font-size: 14px;
  font-weight: 600;
}
.mail-panel summary::-webkit-details-marker { display: none; }
.mail-body { margin-top: 12px; }
.mail { margin: 0 0 10px; padding: 0; border: 0; }
.mail legend { padding: 0; margin: 0 0 6px; color: var(--fog); font-size: 12px; }
input[type=email] {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  font: 16px "Noto Sans SC", sans-serif;
}
.modes { display: grid; gap: 6px; }
.modes label {
  display: block;
  margin: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-size: 14px;
}
.modes input { accent-color: var(--sea); margin-right: 8px; }
button {
  width: 100%;
  margin-top: 8px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font: 600 14px "Noto Sans SC", sans-serif;
  cursor: pointer;
}
button:disabled { opacity: 0.6; cursor: wait; }
.foot { margin: 10px 2px 0; color: var(--fog); font-size: 12px; }
#out, #cancel { margin-top: 14px; }
#out h1, #cancel h1 { font-size: 16px; margin: 0 0 6px; }
#out p, #cancel p { margin: 0; color: var(--fog); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">桌面小工具</p>
  <h1 class="brand"><span>WorkTimer</span></h1>
  <p class="sub">弹性下班计时器</p>
  <p class="lead">还差多久能走？装上就能看。</p>
  <p class="ver" id="ver">正在查最新版…</p>

  <section class="panel" id="signup">
    <h1>选系统，下载安装包</h1>
    <p class="note">Win7 和 Win10 不是同一个文件，别下错了。</p>
    <form id="f">
      <div class="os" role="radiogroup" aria-label="系统">
        <label>
          <input type="radio" name="os" value="main" checked>
          <strong>Windows 8.1 / 10 / 11</strong>
          <span>WorkTimer-Setup.exe</span>
        </label>
        <label>
          <input type="radio" name="os" value="win7">
          <strong>Windows 7 / 8</strong>
          <span>WorkTimer-Win7-Setup.exe</span>
        </label>
      </div>
      <a class="dl" id="dl" href="#">下载安装包</a>
      <p class="hint" id="dl-hint">点一下就下。</p>

      <details class="mail-panel">
        <summary>发到邮箱</summary>
        <div class="mail-body">
          <fieldset class="mail">
            <legend>邮箱</legend>
            <input type="email" name="email" placeholder="name@example.com" autocomplete="email">
          </fieldset>
          <fieldset class="mail">
            <legend>怎么寄</legend>
            <div class="modes">
              <label><input type="radio" name="mode" value="once" checked> 只要这一版</label>
              <label><input type="radio" name="mode" value="auto"> 以后每版都寄</label>
            </div>
          </fieldset>
          <button type="submit">寄到邮箱</button>
          <p class="foot">从 earoot@163.com 发出</p>
        </div>
      </details>
    </form>
    <div id="out"></div>
  </section>

  <section class="panel" id="cancel" hidden>
    <h1>取消长期订阅</h1>
    <p id="cancel-text">正在取消…</p>
  </section>
</div>
<script>
const API = "https://1407920495-4qprkfktiz.ap-guangzhou.tencentscf.com";
const REPO = "https://gitcode.com/mdslanruo/work-timer/releases/download";
const ver = document.getElementById("ver");
const dl = document.getElementById("dl");
const hint = document.getElementById("dl-hint");
let downloads = { main: "", win7: "" };

function guessOs() {
  const ua = navigator.userAgent || "";
  if (/Windows NT 6\.[12]/.test(ua)) return "win7";
  return "main";
}

function selectedOs() {
  const el = document.querySelector('input[name=os]:checked');
  return (el && el.value) || "main";
}

function refreshDownload() {
  const os = selectedOs();
  const url = downloads[os] || "";
  dl.href = url || "#";
  dl.classList.toggle("off", !url);
  dl.textContent = os === "win7" ? "下载 Win7 / 8" : "下载 Win10 / 11";
  hint.textContent = url ? "点一下就下。" : "链接还没出来，刷一下或发邮箱。";
}

function fallbackDownloads(version) {
  const tag = "v" + String(version || "").replace(/^v/i, "");
  if (!version) return { main: "", win7: "" };
  return {
    main: REPO + "/" + tag + "/WorkTimer-Setup.exe",
    win7: REPO + "/" + tag + "/WorkTimer-Win7-Setup.exe",
  };
}

const guessed = guessOs();
document.querySelectorAll('input[name=os]').forEach((el) => {
  el.checked = el.value === guessed;
  el.addEventListener("change", refreshDownload);
});

fetch(API + "?meta=1").then((r) => r.text()).then((text) => {
  let version = "";
  let got = {};
  try {
    const data = JSON.parse(text);
    version = String((data.version || "")).trim();
    got = data.downloads || {};
  } catch (e) {}
  ver.textContent = version ? ("现在是 " + version) : "版本号暂时看不着。";
  const fb = fallbackDownloads(version);
  downloads = {
    main: String(got.main || fb.main || ""),
    win7: String(got.win7 || fb.win7 || ""),
  };
  refreshDownload();
}).catch(() => {
  ver.textContent = "版本号暂时看不着。";
  refreshDownload();
});
refreshDownload();

function showReply(box, title, text) {
  box.innerHTML = "<h1></h1><p></p>";
  box.querySelector("h1").textContent = title || "已提交";
  box.querySelector("p").textContent = text || "";
}

const cancelToken = new URLSearchParams(location.search).get("cancel");
if (cancelToken) {
  document.getElementById("signup").hidden = true;
  const panel = document.getElementById("cancel");
  panel.hidden = false;
  const body = new URLSearchParams();
  body.set("cancel", cancelToken);
  fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } })
    .then((r) => r.text())
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const title = (doc.querySelector("h1") || {}).textContent || "已取消";
      const text = (doc.querySelector("p") || {}).textContent || "";
      panel.querySelector("h1").textContent = title;
      document.getElementById("cancel-text").textContent = text;
    })
    .catch(() => {
      document.getElementById("cancel-text").textContent = "没取消成，过会儿再试。";
    });
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const out = document.getElementById("out");
  const btn = ev.target.querySelector("button");
  const email = (ev.target.email.value || "").trim();
  if (!email) {
    out.innerHTML = "<p>先填邮箱。</p>";
    const details = ev.target.querySelector("details");
    if (details) details.open = true;
    ev.target.email.focus();
    return;
  }
  btn.disabled = true;
  out.innerHTML = "<p>正在发…</p>";
  const body = new URLSearchParams(new FormData(ev.target));
  try {
    const resp = await fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const title = (doc.querySelector("h1") || {}).textContent || "";
    const text = (doc.querySelector("p") || {}).textContent || html;
    showReply(out, title, text);
  } catch (e) {
    out.innerHTML = "<p>没发出去，过会儿再试。</p>";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
