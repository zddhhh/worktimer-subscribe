<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载 WorkTimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #10141c;
  --fog: #5f6b7a;
  --paper: rgba(255, 255, 255, 0.9);
  --line: rgba(16, 20, 28, 0.12);
  --sun: #ff8a3d;
  --sun-deep: #e56a18;
  --sea: #1f6f6a;
  --ok: #0f766e;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font: 16px/1.55 "Noto Sans SC", "Instrument Sans", sans-serif;
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(255, 156, 84, 0.42), transparent 58%),
    radial-gradient(900px 560px at -8% 18%, rgba(47, 168, 158, 0.22), transparent 55%),
    radial-gradient(700px 480px at 55% 110%, rgba(99, 140, 220, 0.18), transparent 50%),
    linear-gradient(180deg, #d9e4f2 0%, #eef3f8 42%, #f7f4ef 100%);
  overflow-x: hidden;
}
.sky {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.55;
  animation: drift 16s ease-in-out infinite alternate;
}
.blob.a {
  width: 42vw; height: 42vw; min-width: 280px; min-height: 280px;
  right: -6vw; top: -10vw;
  background: radial-gradient(circle, rgba(255, 168, 96, 0.85), transparent 68%);
}
.blob.b {
  width: 34vw; height: 34vw; min-width: 220px; min-height: 220px;
  left: -10vw; top: 28vh;
  background: radial-gradient(circle, rgba(64, 180, 168, 0.55), transparent 70%);
  animation-duration: 22s;
  animation-delay: -4s;
}
.blob.c {
  width: 28vw; height: 28vw; min-width: 180px; min-height: 180px;
  right: 18vw; bottom: -8vw;
  background: radial-gradient(circle, rgba(120, 150, 220, 0.35), transparent 70%);
  animation-duration: 19s;
  animation-delay: -8s;
}
@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(2vw, 3vh, 0) scale(1.08); }
}
.clock {
  position: fixed;
  right: max(-8vw, -80px);
  top: max(-4vh, -40px);
  width: min(62vw, 720px);
  height: min(62vw, 720px);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.55;
  background:
    repeating-conic-gradient(from 0deg, rgba(16,20,28,0.1) 0 1.2deg, transparent 1.2deg 30deg),
    radial-gradient(circle at 50% 50%, transparent 58%, rgba(16,20,28,0.06) 59%, transparent 61%),
    radial-gradient(circle at 50% 50%, transparent 72%, rgba(16,20,28,0.07) 73%, transparent 75%);
  mask-image: radial-gradient(circle, transparent 34%, #000 36%, #000 78%, transparent 80%);
  animation: turn 48s linear infinite;
}
.clock::after {
  content: "";
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  border: 1px solid rgba(16, 20, 28, 0.08);
  background: conic-gradient(from 200deg, transparent 0 74%, rgba(255, 138, 61, 0.55) 74% 78%, transparent 78% 100%);
  mask-image: radial-gradient(circle, transparent 62%, #000 64%);
  animation: turn 14s linear infinite reverse;
}
@keyframes turn { to { transform: rotate(360deg); } }

.page {
  position: relative;
  z-index: 1;
  width: min(720px, calc(100% - 40px));
  margin: 0 auto;
  padding: 56px 0 72px;
}
@media (max-width: 860px) {
  .page { padding-top: 36px; }
  .clock { opacity: 0.35; width: 120vw; height: 120vw; right: -40vw; top: -20vw; }
}

.hero { padding-top: 8px; }
.kicker {
  margin: 0 0 18px;
  font-family: "Instrument Sans", "Noto Sans SC", sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--sea);
}
.brand {
  margin: 0;
  font-family: Syne, "Noto Sans SC", sans-serif;
  font-weight: 800;
  font-size: clamp(36px, 8vw, 52px);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.brand span {
  background: linear-gradient(115deg, #10141c 0%, #163a38 48%, #c45a12 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lead {
  margin: 14px 0 0;
  color: var(--fog);
  font-size: 15px;
  white-space: nowrap;
}
@media (max-width: 420px) {
  .lead { white-space: normal; }
}
.ver {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 26px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.55);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  font-family: "Instrument Sans", "Noto Sans SC", sans-serif;
  font-size: 13px;
  font-weight: 600;
}
.ver i {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 5px rgba(15, 118, 110, 0.16);
  font-style: normal;
}

.panel {
  margin-top: 22px;
  padding: 24px;
  border-radius: 28px;
  background: var(--paper);
  border: 1px solid rgba(16, 20, 28, 0.08);
  box-shadow:
    0 24px 60px rgba(16, 20, 28, 0.1),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter: blur(18px);
  animation: rise 0.8s ease both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
.panel h1 {
  margin: 0;
  color: var(--ink);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.note {
  margin: 8px 0 18px;
  color: #3f4b59;
  font-size: 14px;
}
.os {
  display: grid;
  gap: 10px;
  margin-bottom: 14px;
}
.os label {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 12px;
  align-items: center;
  margin: 0;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.os label:hover { transform: translateY(-1px); }
.os label:has(input:checked) {
  border-color: rgba(229, 106, 24, 0.45);
  background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255, 236, 214, 0.65));
  box-shadow: 0 10px 24px rgba(229, 106, 24, 0.12);
}
.os input { grid-row: span 2; accent-color: var(--sun-deep); }
.os strong { font-size: 15px; }
.os span { color: var(--fog); font-size: 12px; }

.dl {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 58px;
  padding: 16px 18px;
  border: 0;
  border-radius: 18px;
  text-decoration: none;
  color: #fff;
  background: #e56a18;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.18), transparent 40%),
    linear-gradient(135deg, #ff9a4d 0%, #e56a18 48%, #c24a0f 100%);
  font-family: Syne, "Noto Sans SC", sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.01em;
  box-shadow: 0 16px 36px rgba(194, 74, 15, 0.28);
  transition: transform .18s ease, filter .18s ease, background .18s ease;
}
.dl:hover { transform: translateY(-2px); filter: brightness(1.05); }
.dl.off {
  color: rgba(16, 20, 28, 0.45);
  background: #e8edf3;
  background-image: none;
  box-shadow: none;
  pointer-events: none;
  transform: none;
  filter: none;
}
.hint { margin: 12px 4px 0; color: var(--fog); font-size: 13px; }

.mail-panel {
  margin-top: 18px;
  padding: 18px;
  border-radius: 20px;
  border: 1px solid rgba(16, 20, 28, 0.1);
  background: rgba(248, 250, 252, 0.95);
}
.mail-panel summary {
  cursor: pointer;
  list-style: none;
  font-weight: 700;
  font-size: 15px;
}
.mail-panel summary::-webkit-details-marker { display: none; }
.mail-panel summary::after {
  content: "展开";
  float: right;
  color: var(--fog);
  font-weight: 500;
  font-size: 13px;
}
.mail-panel[open] summary::after { content: "收起"; }
.mail-body { margin-top: 16px; }
.mail { margin: 0 0 12px; padding: 0; border: 0; }
.mail legend {
  padding: 0;
  margin: 0 0 8px;
  color: var(--fog);
  font-size: 13px;
}
input[type=email] {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,0.8);
  font: 16px "Noto Sans SC", sans-serif;
  color: var(--ink);
}
input[type=email]:focus {
  outline: 2px solid rgba(229, 106, 24, 0.28);
  border-color: rgba(229, 106, 24, 0.45);
}
.modes { display: grid; gap: 8px; }
.modes label {
  display: block;
  margin: 0;
  padding: 11px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.55);
  cursor: pointer;
}
.modes label:has(input:checked) {
  border-color: rgba(31, 111, 106, 0.4);
  background: rgba(31, 111, 106, 0.08);
}
.modes input { accent-color: var(--sea); margin-right: 8px; }
button {
  width: 100%;
  margin-top: 12px;
  min-height: 48px;
  padding: 12px 18px;
  border: 1px solid rgba(16, 20, 28, 0.12);
  border-radius: 14px;
  background: rgba(255,255,255,0.78);
  color: var(--ink);
  font: 700 15px "Instrument Sans", "Noto Sans SC", sans-serif;
  cursor: pointer;
}
button:hover { background: #fff; }
button:disabled { opacity: 0.6; cursor: wait; }
.foot { margin: 12px 2px 0; color: var(--fog); font-size: 12px; }
#out, #cancel { margin-top: 16px; }
#out h1, #cancel h1 { font-size: 18px; margin: 0 0 8px; }
#out p, #cancel p { margin: 0; color: var(--fog); }
#cancel.panel { margin-top: 0; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>
  <div class="clock"></div>
</div>

<div class="page">
  <div>
    <header class="hero">
      <p class="kicker">Desktop timer</p>
      <h1 class="brand"><span>WorkTimer</span></h1>
      <p class="lead">弹性下班计时器，桌面倒计时，下载安装即可用。</p>
      <p class="ver"><i></i><span id="ver">正在获取版本…</span></p>
    </header>

    <section class="panel" id="signup">
      <h1>选系统，下载安装包</h1>
      <p class="note">Windows 7 和 Windows 10 的安装包不同，请先选择系统。也可以把下载链接发到邮箱。</p>
      <form id="f">
        <div class="os" role="radiogroup" aria-label="系统">
          <label>
            <input type="radio" name="os" value="main" checked>
            <strong>Windows 8.1 / 10 / 11</strong>
            <span>WorkTimer-Setup.exe</span>
          </label>
          <label>
            <input type="radio" name="os" value="win7">
            <strong>Windows 7 / 8</strong>
            <span>WorkTimer-Win7-Setup.exe</span>
          </label>
        </div>
        <a class="dl" id="dl" href="#">下载安装包</a>
        <p class="hint" id="dl-hint">无需登录，直接下载。</p>

        <details class="mail-panel">
          <summary>用邮箱接收下载链接</summary>
          <div class="mail-body">
            <fieldset class="mail">
              <legend>邮箱</legend>
              <input type="email" name="email" placeholder="name@example.com" autocomplete="email">
            </fieldset>
            <fieldset class="mail">
              <legend>接收方式</legend>
              <div class="modes">
                <label><input type="radio" name="mode" value="once" checked> 只要这一版</label>
                <label><input type="radio" name="mode" value="auto"> 以后每版都寄</label>
              </div>
            </fieldset>
            <button type="submit">寄到邮箱</button>
            <p class="foot">发件邮箱：earoot@163.com</p>
          </div>
        </details>
      </form>
      <div id="out"></div>
    </section>

    <section class="panel" id="cancel" hidden>
      <h1>取消长期订阅</h1>
      <p id="cancel-text">正在取消…</p>
    </section>
  </div>
</div>

<script>
const API = "https://1407920495-4qprkfktiz.ap-guangzhou.tencentscf.com";
const REPO = "https://gitcode.com/mdslanruo/work-timer/releases/download";
const ver = document.getElementById("ver");
const dl = document.getElementById("dl");
const hint = document.getElementById("dl-hint");
let downloads = { main: "", win7: "" };

function guessOs() {
  const ua = navigator.userAgent || "";
  if (/Windows NT 6\.[12]/.test(ua)) return "win7";
  return "main";
}

function selectedOs() {
  const el = document.querySelector('input[name=os]:checked');
  return (el && el.value) || "main";
}

function refreshDownload() {
  const os = selectedOs();
  const url = downloads[os] || "";
  dl.href = url || "#";
  dl.classList.toggle("off", !url);
  dl.textContent = os === "win7" ? "下载 Windows 7 / 8 安装包" : "下载 Windows 8.1 / 10 / 11 安装包";
  hint.textContent = url ? "无需登录，直接下载。" : "下载地址暂未获取到，请刷新，或改用邮箱接收。";
}

function fallbackDownloads(version) {
  const tag = "v" + String(version || "").replace(/^v/i, "");
  if (!version) return { main: "", win7: "" };
  return {
    main: REPO + "/" + tag + "/WorkTimer-Setup.exe",
    win7: REPO + "/" + tag + "/WorkTimer-Win7-Setup.exe",
  };
}

const guessed = guessOs();
document.querySelectorAll('input[name=os]').forEach((el) => {
  el.checked = el.value === guessed;
  el.addEventListener("change", refreshDownload);
});

fetch(API + "?meta=1").then((r) => r.text()).then((text) => {
  let version = "";
  let got = {};
  try {
    const data = JSON.parse(text);
    version = String((data.version || "")).trim();
    got = data.downloads || {};
  } catch (e) {}
  ver.textContent = version ? ("当前版本 " + version) : "暂时无法获取版本，请刷新重试。";
  const fb = fallbackDownloads(version);
  downloads = {
    main: String(got.main || fb.main || ""),
    win7: String(got.win7 || fb.win7 || ""),
  };
  refreshDownload();
}).catch(() => {
  ver.textContent = "暂时无法获取版本，请刷新重试。";
  refreshDownload();
});
refreshDownload();

function showReply(box, title, text) {
  box.innerHTML = "<h1></h1><p></p>";
  box.querySelector("h1").textContent = title || "已提交";
  box.querySelector("p").textContent = text || "";
}

const cancelToken = new URLSearchParams(location.search).get("cancel");
if (cancelToken) {
  document.getElementById("signup").hidden = true;
  const panel = document.getElementById("cancel");
  panel.hidden = false;
  const body = new URLSearchParams();
  body.set("cancel", cancelToken);
  fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } })
    .then((r) => r.text())
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const title = (doc.querySelector("h1") || {}).textContent || "已取消";
      const text = (doc.querySelector("p") || {}).textContent || "";
      panel.querySelector("h1").textContent = title;
      document.getElementById("cancel-text").textContent = text;
    })
    .catch(() => {
      document.getElementById("cancel-text").textContent = "取消失败，请稍后再打开此链接。";
    });
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const out = document.getElementById("out");
  const btn = ev.target.querySelector("button");
  const email = (ev.target.email.value || "").trim();
  if (!email) {
    out.innerHTML = "<p>请先填写邮箱。</p>";
    const details = ev.target.querySelector("details");
    if (details) details.open = true;
    ev.target.email.focus();
    return;
  }
  btn.disabled = true;
  out.innerHTML = "<p>正在发送…</p>";
  const body = new URLSearchParams(new FormData(ev.target));
  try {
    const resp = await fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const title = (doc.querySelector("h1") || {}).textContent || "";
    const text = (doc.querySelector("p") || {}).textContent || html;
    showReply(out, title, text);
  } catch (e) {
    out.innerHTML = "<p>发送失败，请稍后再试。</p>";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
