<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载 WorkTimer</title>
<style>
body { margin:0; font:16px/1.55 "Microsoft YaHei",sans-serif; background:#efe6d8; color:#3a241c; }
main { max-width:440px; margin:28px auto; padding:22px 20px 26px; background:#fbf7f1; border-radius:16px; box-shadow:0 10px 30px rgba(58,36,28,.08); }
h1 { font-size:22px; margin:4px 0 8px; }
.brand { margin:0; font-size:13px; letter-spacing:.08em; color:#8c2f2f; }
.ver { display:inline-block; margin:0 0 12px; padding:4px 10px; border-radius:999px; background:#f3e6d4; font-weight:bold; }
.note { color:#6b5346; font-size:14px; margin:0 0 18px; }
fieldset { margin:0 0 14px; padding:12px 12px 8px; border:1px solid #eadfce; border-radius:12px; }
legend { padding:0 6px; font-size:13px; color:#6b5346; }
label.choice { display:block; margin:0 0 6px; padding:8px 10px; border-radius:8px; background:#fff; }
label.choice:has(input:checked) { background:#f8ebe3; outline:1px solid #e4c7b8; }
input[type=email] { width:100%; box-sizing:border-box; font:16px sans-serif; padding:10px 12px; border:1px solid #eadfce; border-radius:8px; }
button, .dl { display:block; width:100%; box-sizing:border-box; margin-top:6px; font:16px sans-serif; padding:12px 18px; background:#8c2f2f; color:#fff; border:0; border-radius:10px; text-align:center; text-decoration:none; }
button.ghost, .ghost { background:#fff; color:#8c2f2f; outline:1px solid #e4c7b8; }
button:disabled, .dl.off { opacity:.6; pointer-events:none; }
.hint { margin:8px 2px 0; color:#6b5346; font-size:13px; }
.split { margin:22px 0 10px; color:#8c6b5c; font-size:13px; text-align:center; }
#out, #cancel { margin-top:16px; }
#out h1, #cancel h1 { font-size:18px; }
</style>
</head>
<body>
<main>
<p class="brand">弹性下班计时器</p>
<div id="signup">
<h1>选系统，下载安装包</h1>
<p class="ver" id="ver">最新版本：正在获取…</p>
<p class="note">Windows 7 和 10 不是同一份安装包。先选自己的系统再下载。也可以填邮箱，把地址寄到手里。</p>
<form id="f">
<fieldset>
<legend>系统</legend>
<label class="choice"><input type="radio" name="os" value="main" checked> Windows 8.1、10、11</label>
<label class="choice"><input type="radio" name="os" value="win7"> Windows 7、8</label>
</fieldset>
<a class="dl" id="dl" href="#">下载安装包</a>
<p class="hint" id="dl-hint">点上面直接下载，不用登录。</p>
<p class="split">或者用邮箱收链接</p>
<fieldset>
<legend>邮箱</legend>
<input type="email" name="email" placeholder="name@example.com">
</fieldset>
<fieldset>
<legend>寄送</legend>
<label class="choice"><input type="radio" name="mode" value="once" checked> 只要这一版</label>
<label class="choice"><input type="radio" name="mode" value="auto"> 以后每版都寄</label>
</fieldset>
<button type="submit" class="ghost">寄到邮箱</button>
<p class="hint">发信邮箱 earoot@163.com</p>
</form>
<div id="out"></div>
</div>
<div id="cancel" hidden>
<h1>取消长期订阅</h1>
<p id="cancel-text">正在取消…</p>
</div>
</main>
<script>
const API = "https://1407920495-4qprkfktiz.ap-guangzhou.tencentscf.com";
const REPO = "https://gitcode.com/mdslanruo/work-timer/releases/download";
const ver = document.getElementById("ver");
const dl = document.getElementById("dl");
const hint = document.getElementById("dl-hint");
let downloads = { main: "", win7: "" };

function guessOs() {
  const ua = navigator.userAgent || "";
  if (/Windows NT 6\.[12]/.test(ua)) return "win7";
  return "main";
}

function selectedOs() {
  const el = document.querySelector('input[name=os]:checked');
  return (el && el.value) || "main";
}

function refreshDownload() {
  const os = selectedOs();
  const url = downloads[os] || "";
  dl.href = url || "#";
  dl.classList.toggle("off", !url);
  dl.textContent = os === "win7" ? "下载 Windows 7 / 8 安装包" : "下载 Windows 8.1 / 10 / 11 安装包";
  hint.textContent = url ? "点上面直接下载，不用登录。" : "下载地址还没取到，刷新再试，或改用邮箱。";
}

function fallbackDownloads(version) {
  const tag = "v" + String(version || "").replace(/^v/i, "");
  if (!version) return { main: "", win7: "" };
  return {
    main: REPO + "/" + tag + "/WorkTimer-Setup.exe",
    win7: REPO + "/" + tag + "/WorkTimer-Win7-Setup.exe",
  };
}

const guessed = guessOs();
document.querySelectorAll('input[name=os]').forEach((el) => {
  el.checked = el.value === guessed;
  el.addEventListener("change", refreshDownload);
});

fetch(API + "?meta=1").then((r) => r.text()).then((text) => {
  let version = "";
  let got = {};
  try {
    const data = JSON.parse(text);
    version = String((data.version || "")).trim();
    got = data.downloads || {};
  } catch (e) {}
  ver.textContent = version ? ("最新版本：" + version) : "最新版本暂时取不到，刷新再看。";
  const fb = fallbackDownloads(version);
  downloads = {
    main: String(got.main || fb.main || ""),
    win7: String(got.win7 || fb.win7 || ""),
  };
  refreshDownload();
}).catch(() => {
  ver.textContent = "最新版本暂时取不到，刷新再看。";
  refreshDownload();
});
refreshDownload();

function showReply(box, title, text) {
  box.innerHTML = "<h1></h1><p></p>";
  box.querySelector("h1").textContent = title || "已提交";
  box.querySelector("p").textContent = text || "";
}

const cancelToken = new URLSearchParams(location.search).get("cancel");
if (cancelToken) {
  document.getElementById("signup").hidden = true;
  const panel = document.getElementById("cancel");
  panel.hidden = false;
  const body = new URLSearchParams();
  body.set("cancel", cancelToken);
  fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } })
    .then((r) => r.text())
    .then((html) => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const title = (doc.querySelector("h1") || {}).textContent || "已取消";
      const text = (doc.querySelector("p") || {}).textContent || "";
      panel.querySelector("h1").textContent = title;
      document.getElementById("cancel-text").textContent = text;
    })
    .catch(() => {
      document.getElementById("cancel-text").textContent = "没取消成，过会儿再打开这个链接。";
    });
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const out = document.getElementById("out");
  const btn = ev.target.querySelector("button");
  const email = (ev.target.email.value || "").trim();
  if (!email) {
    out.innerHTML = "<p>要寄到邮箱的话，先填邮箱。</p>";
    ev.target.email.focus();
    return;
  }
  btn.disabled = true;
  out.innerHTML = "<p>正在寄，稍等。</p>";
  const body = new URLSearchParams(new FormData(ev.target));
  try {
    const resp = await fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const title = (doc.querySelector("h1") || {}).textContent || "";
    const text = (doc.querySelector("p") || {}).textContent || html;
    showReply(out, title, text);
  } catch (e) {
    out.innerHTML = "<p>没寄成，过会儿再试。</p>";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
