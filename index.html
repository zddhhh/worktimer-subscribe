<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订阅 WorkTimer</title>
<style>
body { margin:0; font:16px/1.5 "Microsoft YaHei",sans-serif; background:#f6f1e8; color:#3a241c; }
main { max-width:420px; margin:24px auto; padding:0 16px 32px; }
h1 { font-size:22px; }
label { display:block; margin:14px 0 6px; }
input[type=email] { width:100%; box-sizing:border-box; font:16px sans-serif; padding:10px; }
button { margin-top:18px; font:16px sans-serif; padding:10px 18px; background:#8c2f2f; color:#fff; border:0; }
.note { color:#6b5346; font-size:14px; }
.ver { font-size:18px; font-weight:bold; margin:8px 0 0; }
</style>
</head>
<body>
<main>
<h1>订阅 WorkTimer</h1>
<p class="ver" id="ver">最新版本：正在获取…</p>
<p class="note">内网收不到更新时，填邮箱。上面就是现在的最新版本，装好后看窗口标题对照。安装包由 earoot@163.com 寄出，请认准这个发件人。压缩包里有 Win10/11 和 Win7 两个安装程序。</p>
<form id="f">
<label>邮箱<br><input type="email" name="email" required placeholder="name@example.com"></label>
<label><input type="radio" name="mode" value="once" checked> 只要这一版</label>
<label><input type="radio" name="mode" value="auto"> 以后每版都寄</label>
<button type="submit">寄给我</button>
</form>
<div id="out"></div>
</main>
<script>
const API = "https://1407920495-4qprkfktiz.ap-guangzhou.tencentscf.com";
const ver = document.getElementById("ver");
fetch(API + "?meta=1").then((r) => r.text()).then((text) => {
  let version = "";
  try { version = String((JSON.parse(text).version || "")).trim(); } catch (e) {}
  ver.textContent = version ? ("最新版本：" + version) : "最新版本暂时取不到，刷新再看。";
}).catch(() => {
  ver.textContent = "最新版本暂时取不到，刷新再看。";
});
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const out = document.getElementById("out");
  const btn = ev.target.querySelector("button");
  btn.disabled = true;
  out.innerHTML = "<p>正在寄，两个安装包比较大，稍等。</p>";
  const body = new URLSearchParams(new FormData(ev.target));
  try {
    const resp = await fetch(API, { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const title = (doc.querySelector("h1") || {}).textContent || "";
    const text = (doc.querySelector("p") || {}).textContent || html;
    out.innerHTML = "<h1></h1><p></p>";
    out.querySelector("h1").textContent = title || "已提交";
    out.querySelector("p").textContent = text;
  } catch (e) {
    out.innerHTML = "<p>没寄成，过会儿再试。</p>";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
